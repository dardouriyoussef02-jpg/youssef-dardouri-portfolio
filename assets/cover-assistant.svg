    <rect x="92" y="272" width="230" height="11" rx="5.5" fill="#3d4460"/>
    <rect x="92" y="300" width="266" height="11" rx="5.5" fill="#3d4460"/>
    <rect x="92" y="328" width="170" height="11" rx="5.5" fill="#3d4460"/>
    <g fill="#8b7cff" opacity="0.9">
