    <rect x="182" y="482" width="240" height="11" rx="5.5" fill="#ffffff" opacity="0.85"/>
    <rect x="182" y="510" width="200" height="11" rx="5.5" fill="#ffffff" opacity="0.7"/>
    <rect x="182" y="538" width="140" height="11" rx="5.5" fill="#ffffff" opacity="0.55"/>
