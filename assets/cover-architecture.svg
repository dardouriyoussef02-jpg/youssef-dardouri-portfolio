<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960" role="img" aria-label="Layered web application architecture illustration">
  <defs>
    <linearGradient id="bgArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a2f"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="accArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#19d3ff"/>
    </linearGradient>
    <pattern id="gridArch" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="540" height="960" fill="url(#bgArch)"/>
  <rect width="540" height="960" fill="url(#gridArch)"/>
  <circle cx="460" cy="160" r="190" fill="#8b7cff" opacity="0.13"/>
  <circle cx="90" cy="880" r="170" fill="#19d3ff" opacity="0.08"/>

  <!-- frontend -->
  <g>
    <rect x="80" y="220" width="380" height="130" rx="20" fill="#171b2b" stroke="#3a4059" stroke-width="2"/>
    <rect x="80" y="220" width="380" height="36" rx="20" fill="#1e2337"/>
    <rect x="80" y="248" width="380" height="8" fill="#1e2337"/>
    <g fill="#3d4460">
      <circle cx="106" cy="238" r="6"/>
      <circle cx="126" cy="238" r="6"/>
      <circle cx="146" cy="238" r="6"/>
    </g>
    <g fill="#3d4460">
      <rect x="108" y="284" width="120" height="11" rx="5.5"/>
      <rect x="108" y="310" width="190" height="11" rx="5.5"/>
    </g>
    <rect x="330" y="284" width="100" height="46" rx="10" fill="#8b7cff" opacity="0.35"/>
  </g>

  <!-- connector -->
  <path d="M270 350 L 270 410" stroke="url(#accArch)" stroke-width="3"/>
  <path d="M263 410 l7 12 7 -12 z" fill="#8b7cff"/>

  <!-- api -->
  <g>
    <rect x="80" y="430" width="380" height="130" rx="20" fill="#171b2b" stroke="#3a4059" stroke-width="2"/>
    <rect x="80" y="430" width="380" height="36" rx="20" fill="#1e2337"/>
    <rect x="80" y="458" width="380" height="8" fill="#1e2337"/>
    <text x="108" y="454" font-family="monospace" font-size="17" fill="#71e6a5">REST API</text>
    <g fill="#3d4460">
      <rect x="108" y="492" width="160" height="11" rx="5.5"/>
      <rect x="108" y="518" width="230" height="11" rx="5.5"/>
    </g>
    <g fill="#19d3ff" opacity="0.7">
      <rect x="330" y="492" width="100" height="11" rx="5.5"/>
      <rect x="330" y="518" width="70" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- connector -->
  <path d="M270 560 L 270 620" stroke="url(#accArch)" stroke-width="3"/>
  <path d="M263 620 l7 12 7 -12 z" fill="#8b7cff"/>

  <!-- database -->
  <g>
    <rect x="80" y="640" width="380" height="130" rx="20" fill="#171b2b" stroke="#3a4059" stroke-width="2"/>
    <rect x="80" y="640" width="380" height="36" rx="20" fill="#1e2337"/>
    <rect x="80" y="668" width="380" height="8" fill="#1e2337"/>
    <g transform="translate(112,700)">
      <ellipse cx="46" cy="12" rx="46" ry="14" fill="#1e2337" stroke="#3a4059" stroke-width="2"/>
      <path d="M0 12 v34 a46 14 0 0 0 92 0 v-34" fill="#1e2337" stroke="#3a4059" stroke-width="2"/>
      <path d="M0 29 a46 14 0 0 0 92 0" fill="none" stroke="#3a4059" stroke-width="2"/>
    </g>
    <g fill="#3d4460">
      <rect x="230" y="704" width="180" height="11" rx="5.5"/>
      <rect x="230" y="730" width="120" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- auth badge -->
  <g transform="translate(180,820)">
    <rect x="0" y="0" width="180" height="66" rx="18" fill="#171b2b" stroke="url(#accArch)" stroke-width="2.5"/>
    <path d="M46 30 v-8 a14 14 0 0 1 28 0 v8" fill="none" stroke="#b2a8ff" stroke-width="4"/>
    <rect x="38" y="30" width="44" height="30" rx="7" fill="#b2a8ff"/>
    <rect x="100" y="24" width="60" height="10" rx="5" fill="#3d4460"/>
    <rect x="100" y="42" width="40" height="10" rx="5" fill="#3d4460"/>
  </g>
</svg>
